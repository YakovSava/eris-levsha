server {
    listen 80;
    client_max_body_size 200m;

    # Backend (Django): admin, api, static, media
    location ~ ^/(admin|api)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ { alias /srv/static/; }
    location /media/  { alias /srv/media/; }

    # Frontend (React) — temporarily postponed
    location / {
        default_type text/plain;
        return 200 "Levsha frontend is not deployed yet. API: /api/, admin: /admin/\n";
        # proxy_pass http://frontend:80;
    }
}
